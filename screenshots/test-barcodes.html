<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Barcodes</title>
<style>
  :root { --bg: #ffffff; --ink: #1d1513; --muted: #6f625e; --line: #e8e1de; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 40px; font-size: 14px; }
  .code { padding: 40px 0 72px; border-top: 1px solid var(--line); margin-bottom: 72px; text-align: center; }
  .code h2 { font-size: 18px; margin: 0 0 2px; }
  .code .brand { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  /* Barcodes stay black on white, whatever the theme, so the camera can read them. */
  .code svg { background: #fff; width: 100%; max-width: 340px; height: auto; }
  .bad { color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Tappy test barcodes</h1>
  <p class="note">Scan these one at a time. Each one is spaced apart, so scroll until only one is on screen.</p>
  <div id="list"></div>
</main>
<script>
  const PRODUCTS = [
    ['722252100900', 'Chocolate Chip Energy Bar', 'CLIF'],
    ['028400090896', 'Sea Salt Kettle Cooked Potato Chips', 'Sunny Snacks'],
    ['041196910506', 'Gluten Free Yogurt Covered Pretzels', 'Crunchies'],
    ['044000032029', 'Oreo Cookies', 'Nabisco'],
    ['030000010402', 'Old Fashioned Oats', 'Quaker'],
    ['049000028911', 'Diet Coke', 'Coca-Cola'],
    ['051500255162', 'Creamy Peanut Butter', 'Jif'],
  ];
  const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const R = L.map((p) => p.replace(/./g, (c) => (c === '0' ? '1' : '0')));
  const checkOk = (d) => {
    const n = d.split('').map(Number);
    const sum = n.slice(0, 11).reduce((s, v, i) => s + v * (i % 2 === 0 ? 3 : 1), 0);
    return (10 - (sum % 10)) % 10 === n[11];
  };
  function upcA(d) {
    let bits = '101';
    for (let i = 0; i < 6; i++) bits += L[+d[i]];
    bits += '01010';
    for (let i = 6; i < 12; i++) bits += R[+d[i]];
    bits += '101';
    const m = 3, quiet = 11 * m, h = 140, w = bits.length * m + quiet * 2;
    const guard = (i) => i < 3 || (i >= 45 && i < 50) || i >= 92;
    let rects = '';
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] === '1') rects += `<rect x="${quiet + i * m}" y="10" width="${m}" height="${guard(i) ? h + 10 : h}"/>`;
    }
    const text = `<text x="${w / 2}" y="${h + 40}" text-anchor="middle" font-family="monospace" font-size="22" letter-spacing="3">${d}</text>`;
    return `<svg viewBox="0 0 ${w} ${h + 50}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barcode ${d}"><rect width="${w}" height="${h + 50}" fill="#fff"/><g fill="#000">${rects}</g>${text}</svg>`;
  }
  document.getElementById('list').innerHTML = PRODUCTS.map(([d, name, brand], i) => `
    <section class="code">
      <h2>${i + 1}. ${name}</h2>
      <div class="brand">${brand}</div>
      ${upcA(d)}
      ${checkOk(d) ? '' : '<div class="bad">Check digit invalid</div>'}
    </section>`).join('');
</script>
</body>
</html>
